name: Release

on:
  push:
      tags:
        - openmw-**

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  Windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
    secrets: inherit
  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-26
          - image: macos-26-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}
