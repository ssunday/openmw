name: Build

on:
  - push
  - pull_request

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo

jobs:
  Linux:
    strategy:
      fail-fast: true
      matrix:
        args:
          - triplet: x64-linux-dynamic
            runner_image: ubuntu-latest
          - triplet: arm64-linux-dynamic
            runner_image: ubuntu-24.04-arm
    uses: ./.github/workflows/linux.yml
    with:
      image: ${{ matrix.args.runner_image }}

  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-26
          - image: macos-26-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
          - "2022"
    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
